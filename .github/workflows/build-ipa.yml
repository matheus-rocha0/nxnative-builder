name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      vault_repo:
        description: 'Private storage repo (owner/repo) holding NSP release assets'
        required: true
        type: string
      input_tag:
        description: 'Release tag in vault_repo with nsp.tar.part_*'
        required: true
        default: 'odyssey-input'
        type: string
      output_tag:
        description: 'Release tag in vault_repo to publish IPA parts'
        required: true
        default: 'odyssey-ipa'
        type: string
      language:
        description: 'Optional game language code (e.g. en-US, es, fr, pt, ja)'
        required: false
        default: ''
        type: string
      app_name:
        description: 'Optional custom app name on iPhone home screen'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout nxnative
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install macOS & Python dependencies
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h "$RUNNER_TEMP"
          brew install xcodegen zstd spirv-cross glslang
          xcrun -sdk iphoneos metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal --version
          chmod +x dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate scripts/*.sh dm/ios/*.sh 2>/dev/null || true
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 capstone fonttools backports.zstd

      - name: Prepare prod.keys from Secret
        env:
          PROD_KEYS_B64: ${{ secrets.SWITCH_PROD_KEYS_B64 }}
        run: |
          if [ -z "$PROD_KEYS_B64" ]; then
            echo "Missing SWITCH_PROD_KEYS_B64 secret" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$PROD_KEYS_B64" | base64 --decode > "$RUNNER_TEMP/keys/prod.keys"

      - name: Download & extract private NSP bundle
        env:
          GH_TOKEN: ${{ secrets.VAULT_PAT }}
          VAULT_REPO: ${{ inputs.vault_repo }}
          INPUT_TAG: ${{ inputs.input_tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing VAULT_PAT secret" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/nsp_dir" "$RUNNER_TEMP/out"
          gh release download "$INPUT_TAG" --repo "$VAULT_REPO" --pattern "nsp.tar.part_*" --dir "$RUNNER_TEMP/dl"
          cat "$RUNNER_TEMP/dl"/nsp.tar.part_* | tar -xf - -C "$RUNNER_TEMP/nsp_dir"
          rm -rf "$RUNNER_TEMP/dl"
          echo "NSP files ready (count: $(ls -1 "$RUNNER_TEMP/nsp_dir" | wc -l | tr -d ' '))"
          df -h "$RUNNER_TEMP"

      - name: Build unsigned IPA with nxnative
        env:
          LANG_OPT: ${{ inputs.language }}
          APP_NAME_OPT: ${{ inputs.app_name }}
        run: |
          export DOTNET_ROOT="$(dirname "$(which dotnet)")"
          ARGS=("$RUNNER_TEMP/nsp_dir" -k "$RUNNER_TEMP/keys/prod.keys" -o "$RUNNER_TEMP/out/Game.ipa" --no-keep-extracted --progress lines)
          if [ -n "$LANG_OPT" ]; then
            ARGS+=(-l "$LANG_OPT")
          fi
          if [ -n "$APP_NAME_OPT" ]; then
            ARGS+=(--app-name "$APP_NAME_OPT")
          fi
          python3 scripts/build_ipa_from_nsp.py "${ARGS[@]}"

      - name: Split & publish IPA to private vault release
        env:
          GH_TOKEN: ${{ secrets.VAULT_PAT }}
          VAULT_REPO: ${{ inputs.vault_repo }}
          OUTPUT_TAG: ${{ inputs.output_tag }}
        run: |
          cd "$RUNNER_TEMP/out"
          shasum -a 256 Game.ipa > Game.ipa.sha256
          split -b 600m Game.ipa Game.ipa.part_
          rm -f Game.ipa
          gh release view "$OUTPUT_TAG" --repo "$VAULT_REPO" >/dev/null 2>&1 || \
            gh release create "$OUTPUT_TAG" --repo "$VAULT_REPO" --title "IPA Build ($OUTPUT_TAG)" --notes "Automated private nxnative IPA output"
          gh release upload "$OUTPUT_TAG" --repo "$VAULT_REPO" --clobber Game.ipa.sha256 Game.ipa.part_*

      - name: Upload private diagnostic logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.VAULT_PAT }}
          VAULT_REPO: ${{ inputs.vault_repo }}
          OUTPUT_TAG: ${{ inputs.output_tag }}
        run: |
          LOG_ARCHIVE="$RUNNER_TEMP/build_logs_${GITHUB_RUN_ID}.tar.gz"
          if compgen -G "$RUNNER_TEMP/nsp_dir/*_build/logs" > /dev/null; then
            tar -czf "$LOG_ARCHIVE" -C "$RUNNER_TEMP/nsp_dir" $(cd "$RUNNER_TEMP/nsp_dir" && ls -d *_build/logs) || true
            gh release view "$OUTPUT_TAG" --repo "$VAULT_REPO" >/dev/null 2>&1 || \
              gh release create "$OUTPUT_TAG" --repo "$VAULT_REPO" --title "IPA Build ($OUTPUT_TAG)" --notes "Build logs"
            gh release upload "$OUTPUT_TAG" --repo "$VAULT_REPO" --clobber "$LOG_ARCHIVE" || true
          fi

      - name: Wipe temporary keys and workspace
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/nsp_dir" "$RUNNER_TEMP/out" "$RUNNER_TEMP/dl"
